<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantAsta">
<title>FantAsta 2026/27</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.player,.panel{background:#151d31;border:1px solid #29334b;border-radius:16px}.card{padding:14px}.label{font-size:12px;color:#aab4c8;letter-spacing:.35px}.value{font-size:28px;font-weight:850;margin-top:2px}.tabs,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select{font:inherit}button{border:1px solid #35415e;background:#19233a;color:#fff;border-radius:12px;padding:11px 14px;font-weight:750;min-height:46px}.active{background:#2563eb;border-color:#2563eb}.search{width:100%;padding:14px;border-radius:13px;border:1px solid #35415e;background:#11192b;color:#fff;font-size:17px}.filterBox{display:flex;align-items:center;gap:10px}.filterBox select{background:#11192b;color:#fff;border:1px solid #35415e;border-radius:10px;padding:10px 12px;min-height:44px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px}.player{padding:13px;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;min-height:84px}.playerText{min-width:0}.pn{display:block;font-size:18px;font-weight:850;line-height:1.15;white-space:normal}.meta{display:block;color:#aab4c8;font-size:13px;margin-top:5px;white-space:normal}.grade{display:inline-block;margin-top:7px;font-size:11px;padding:4px 8px;border-radius:8px;font-weight:900;border:1px solid transparent;letter-spacing:.25px}.grade-top{background:#991b1b;color:#fff;border-color:#ef4444}.grade-ottimo{background:#166534;color:#fff;border-color:#22c55e}.grade-buono{background:#1d4ed8;color:#fff;border-color:#60a5fa}.grade-scommessa{background:#7e22ce;color:#fff;border-color:#c084fc}.grade-normale{background:#475569;color:#fff;border-color:#94a3b8}.quote{font-size:22px;font-weight:900;margin-left:12px;flex:0 0 auto}.panel{padding:15px;margin:12px 0}.panel h3{margin:0 0 12px}.panel input{width:90px;padding:10px;border-radius:9px;border:1px solid #45516b;background:#0f1728;color:#fff}.priceRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.danger{border-color:#7f1d1d;color:#fecaca}.ok{background:#166534;border-color:#15803d}.small{font-size:13px;color:#aab4c8}.settingsGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.settingsGrid label{font-size:12px;color:#aab4c8}.settingsGrid input{width:100%;margin-top:4px}.reopenBox{padding-top:6px}.version{margin-top:12px;font-size:12px;color:#64748b}@media(max-width:600px){.app{padding:12px}.top{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr}.settingsGrid{grid-template-columns:repeat(2,1fr)}.pn{font-size:17px}.value{font-size:25px}}
</style>
</head>
<body>
<main class="app">
<div class="top">
<div class="card"><div class="label">CREDITI</div><div class="value" id="credits">500</div></div>
<div class="card"><div class="label">ROSA</div><div class="value" id="squad">0/25</div></div>
<div class="card"><div class="label">OFFERTA MAX</div><div class="value" id="maxBid">476</div></div>
</div>
<div class="tabs" id="tabs">
<button data-view="P">🧤 P</button><button data-view="D">🛡️ D</button><button data-view="C">⚙️ C</button><button data-view="A">⚽ A</button><button data-view="MINE">👕 Mia squadra</button><button data-view="OTHERS">🧾 Altri</button><button data-view="SET">⚙️ Impostazioni</button>
</div>
<input id="search" class="search" placeholder="Cerca giocatore o squadra…">
<div id="filterWrap" class="filters filterBox"><span class="small">Quotazione minima</span><select id="minQ"><option value="1">Tutti</option><option value="2">≥ 2</option><option value="3">≥ 3</option><option value="4">≥ 4</option><option value="5">≥ 5</option><option value="6">≥ 6</option><option value="8">≥ 8</option><option value="10">≥ 10</option></select></div>
<div id="action"></div><div id="info" class="small"></div><div id="list" class="list"></div>
<div class="actions" id="roleActions"><button id="closeRole">✓ Salva e chiudi reparto</button></div>
</main>
<script src="players-base.js?v=10"></script>
<script src="players-extra.js?v=10"></script>
<script src="app-v10.js?v=10"></script>
</body>
</html>
