.paid=v;$('#action').innerHTML='';save();render()}}function settings(){return `<div class="panel"><h3>Impostazioni rosa</h3><div class="settingsGrid"><label>Budget<input id="budget" type="number" min="1" value="${st.budget}"></label>${['P','D','C','A'].map(r=>`<label>${r}<input data-slot="${r}" type="number" min="0" value="${st.slots[r]}"></label>`).join('')}</div><div class="actions"><button id="saveSet" class="ok">Salva impostazioni</button><button id="reset" class="danger">Reset completo asta</button></div><div class="small">Totale rosa: ${totalSlots()} giocatori. Lo stato viene salvato automaticamente su questo dispositivo.</div></div>`}function render(){let m=mine();$('#credits').textContent=credits();$('#squad').textContent=m.length+'/'+totalSlots();$('#maxBid').textContent=maxBid();document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===st.view);if(['P','D','C','A'].includes(b.dataset.view))b.classList.toggle('hidden',st.closed.includes(b.dataset.view))});$('#roleActions').classList.toggle('hidden',!['P','D','C','A'].includes(st.view));$('#search').classList.toggle('hidden',st.view==='SET');$('#list').innerHTML='';$('#action').innerHTML='';if(st.view==='SET'){$('#info').innerHTML=settings();$('#saveSet').onclick=()=>{st.budget=Math.max(1,Math.floor(+$('input#budget').value));document.querySelectorAll('[data-slot]').forEach(i=>st.slots[i.dataset.slot]=Math.max(0,Math.floor(+i.value)));save();render()};$('#reset').onclick=()=>{if(confirm('Cancellare tutta l’asta salvata?')){localStorage.removeItem(KEY);location.reload()}};return}let term=$('#search').value.toLowerCase(),arr=st.view==='MINE'?m:st.view==='OTHERS'?st.players.filter(p=>p.status==='other'):st.players.filter(p=>p.r===st.view&&p.status==='free');arr=arr.filter(p=>(p.n+' '+p.t).toLowerCase().includes(term));$('#info').textContent=st.view==='MINE'?`Mia squadra: ${m.length}/${totalSlots()} · ${credits()} crediti rimasti`:st.view==='OTHERS'?`Acquistati dagli altri: ${arr.length}`:`Disponibili: ${arr.length} · Tuoi nel ruolo: ${m.filter(p=>p.r===st.view).length}/${st.slots[st.view]}`;arr.forEach(p=>{let b=document.createElement('button');b.className='player';b.innerHTML=`<span><span class="pn">${p.n}</span><span class="meta">${p.t} · ${p.r}${p.status==='mine'?' · pagato '+p.paid:''}</span><span class="grade">${p.g}</span></span><span class="quote">${p.q}</span>`;b.onclick=()=>choose(p);$('#list').appendChild(b)})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;$('#search').value='';save();render()});$('#search').oninput=render;$('#closeRole').onclick=()=>{let r=st.view;if(confirm('Chiudere il reparto '+r+'?')){if(!st.closed.includes(r))st.closed.push(r);st.view=['P','D','C','A'].find(x=>!st.closed.includes(x))||'MINE';save();render()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
